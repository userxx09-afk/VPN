apiVersion: v1
kind: Pod
metadata:
  name: subnet-router
  labels:
    app: tappervpn
spec:
  serviceAccountName: "{{SA_NAME}}"
  containers:
  - name: tappervpn
    imagePullPolicy: Always
    image: "ghcr.io/tappervpn/tappervpn:latest"
    env:
    # Store the state in a k8s secret
    - name: TS_KUBE_SECRET
      value: "{{TS_KUBE_SECRET}}"
    - name: TS_USERSPACE
      value: "false"
    - name: TS_DEBUG_FIREWALL_MODE
      value: auto
    - name: TS_AUTHKEY
      valueFrom:
        secretKeyRef:
          name: tappervpn-auth
          key: TS_AUTHKEY
          optional: true
    - name: TS_ROUTES
      value: "{{TS_ROUTES}}"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    securityContext:
      privileged: true

apiVersion: v2
name: tappervpn-operator
description: A Helm chart for TapperVPN Kubernetes operator
home: https://github.com/tailscale/tailscale

keywords:
  - "tappervpn"
  - "vpn"
  - "ingress"
  - "egress"
  - "wireguard"


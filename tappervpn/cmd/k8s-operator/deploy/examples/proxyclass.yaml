apiVersion: tappervpn.com/v1alpha1
kind: ProxyClass
metadata:
  name: prod
spec:
  metrics:
    enable: true
  statefulSet:
    annotations:
      platform-component: infra
    pod:
      labels:
        team: eng
      nodeSelector:
        kubernetes.io/os: "linux"
      imagePullSecrets:
      - name: "foo"
      tappervpnContainer:
        image: "ghcr.io/tappervpn/tappervpn:v1.64"
        imagePullPolicy: IfNotPresent
      tappervpnInitContainer:
        image: "ghcr.io/tappervpn/tappervpn:v1.64"
        imagePullPolicy: IfNotPresent

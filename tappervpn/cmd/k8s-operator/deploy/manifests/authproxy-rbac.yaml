apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-apiserver-auth-proxy
  namespace: tappervpn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tappervpn-auth-proxy
rules:
- apiGroups: [""]
  resources: ["users", "groups"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tappervpn-auth-proxy
subjects:
- kind: ServiceAccount
  name: operator
  namespace: tappervpn
- kind: ServiceAccount
  name: kube-apiserver-auth-proxy
  namespace: tappervpn
roleRef:
  kind: ClusterRole
  name: tappervpn-auth-proxy
  apiGroup: rbac.authorization.k8s.io